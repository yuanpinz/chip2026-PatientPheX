[project]
name = "patientphex-solver"
version = "0.1.0"
description = "CHIP2026 PatientPheX hybrid phenotype extraction solver"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "bioc>=2.1,<3",
    "httpx>=0.28,<0.29",
    "pyahocorasick>=2.2,<3",
    "rapidfuzz>=3.14,<4",
]

[project.scripts]
patientphex-solver = "patientphex_solver:main"

[build-system]
requires = ["uv_build>=0.11.26,<0.12.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pytest>=8.4,<9",
    "ruff>=0.12,<1",
]
